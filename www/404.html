<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <!-- 1) Alamat dasar (base). Halaman ini juga ditampilkan GitHub Pages untuk alamat yang salah dan bersarang
            (misalnya /capstoneproject_popba/abc/def), jadi path "assets/..." harus dihitung dari akar situs.
            Skrip ini WAJIB berada sebelum <link>/<img> lain. Di Cordova/Electron (file://) tidak dipakai. -->
    <script>
        (function () {
            var l = window.location;
            if (l.protocol === 'file:') { return; }
            var base = /\.github\.io$/.test(l.hostname) ? '/' + (l.pathname.split('/')[1] || '') + '/' : '/';
            document.write('<base href="' + base + '">');
        })();
    </script>
    <!-- 2) Tema siang/malam: membaca pilihan yang sama dengan game (nightMode.js) sebelum halaman digambar -->
    <script>
        (function () {
            var night = false;
            try { night = localStorage.getItem('balloonPopMaths_nightMode') === 'true'; } catch (e) { }
            document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');
        })();
    </script>
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Pop Balon Ajaib (PopBA) - halaman tidak ditemukan atau tidak ada koneksi internet.">
    <meta name="author" content="Kelompok 14">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#7fc8ff">
    <link rel="shortcut icon" href="assets/images/balloon-favicon.ico" type="image/x-icon">
    <!-- Nunito sama seperti game. Kalau gagal dimuat (offline), otomatis memakai font bawaan perangkat. -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <title>Pop Balon Ajaib - Halaman Tidak Ditemukan</title>

    <style>
        /* ---------- Font judul (sama dengan game, sudah lokal) ---------- */
        @font-face {
            font-family: 'Whale I Tried';
            src: url('assets/fonts/whale-i-tried.woff2') format('woff2'),
                url('assets/fonts/whale-i-tried.woff') format('woff'),
                url('assets/fonts/whale-i-tried.ttf') format('truetype');
            font-display: swap;
        }

        /* ---------- Warna: siang (bawaan) dan malam ---------- */
        :root {
            --sky-top: #86cdff;
            --sky-mid: #c6ebff;
            --sky-bottom: #fbf0fc;
            --glow: rgba(255, 224, 140, .55);
            --card-bg: rgba(255, 255, 255, .93);
            --card-border: rgba(255, 255, 255, .9);
            --card-shadow: 0 18px 50px rgba(36, 80, 140, .28);
            --title: #a2529a;
            --text: #4b4570;
            --chip-bg: rgba(144, 140, 217, .18);
            --chip-text: #5a479a;
            --dot: #9c70bd;
            --btn-from: #7f7ad1;
            --btn-to: #9c70bd;
            --btn-shadow: rgba(127, 122, 209, .45);
            --ghost-border: #9c70bd;
            --ghost-text: #6c3f94;
            --ghost-hover: rgba(156, 112, 189, .12);
            --focus: #a2529a;
            --icon-ring: #ffffff;
        }

        html[data-theme="night"] {
            --sky-top: #0a0a15;
            --sky-mid: #1a1a3e;
            --sky-bottom: #4a5a70;
            --glow: rgba(160, 175, 255, .22);
            --card-bg: linear-gradient(160deg, rgba(45, 45, 90, .94), rgba(26, 26, 62, .96));
            --card-border: #4a4a7a;
            --card-shadow: 0 18px 50px rgba(0, 0, 0, .55);
            --title: #ffe066;
            --text: #e8e6f0;
            --chip-bg: rgba(255, 224, 102, .13);
            --chip-text: #ffe066;
            --dot: #ffe066;
            --btn-from: #6b5b95;
            --btn-to: #5a4a84;
            --btn-shadow: rgba(107, 91, 149, .6);
            --ghost-border: #7a7aaa;
            --ghost-text: #e8e6f0;
            --ghost-hover: rgba(122, 122, 170, .25);
            --focus: #ffe066;
            --icon-ring: #8b7bb5;
        }

        /* ---------- Dasar ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 16px;
            color: var(--text);
            background: var(--sky-bottom);
        }

        /* ---------- Langit + awan (file awan yang sama dengan game) ---------- */
        .sky {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(ellipse 70vmax 55vmax at 6% 4%, var(--glow), rgba(255, 255, 255, 0) 62%),
                linear-gradient(to bottom, var(--sky-top), var(--sky-mid) 55%, var(--sky-bottom));
        }

        /* bintang kecil, hanya muncul saat malam */
        .sky::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 38%;
            left: 0;
            opacity: 0;
            transition: opacity .6s ease;
            background-image:
                radial-gradient(2px 2px at 8% 18%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 17% 52%, #fff, transparent),
                radial-gradient(2px 2px at 29% 12%, #ffe9a8, transparent),
                radial-gradient(1.5px 1.5px at 38% 40%, #fff, transparent),
                radial-gradient(2px 2px at 52% 24%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 63% 8%, #ffe9a8, transparent),
                radial-gradient(2px 2px at 71% 46%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 82% 20%, #fff, transparent),
                radial-gradient(2px 2px at 91% 36%, #ffe9a8, transparent),
                radial-gradient(1.5px 1.5px at 96% 10%, #fff, transparent);
        }

        html[data-theme="night"] .sky::after {
            opacity: .9;
        }

        .bank {
            position: absolute;
            left: 0;
            bottom: -1px;
            height: var(--h);
            --tile: calc(var(--h) * 3.4286);
            /* gambar awan 960x280 */
            width: calc(100% + var(--tile));
            background-repeat: repeat-x;
            background-position: left bottom;
            background-size: var(--tile) 100%;
            animation: bank var(--dur) linear infinite;
            will-change: transform;
        }

        @keyframes bank {
            to {
                transform: translate3d(calc(var(--tile) * -1), 0, 0);
            }
        }

        .bank.back {
            --h: clamp(110px, 26vh, 300px);
            --dur: 160s;
            background-image: url("assets/images/bg/cloud-day-back.svg");
        }

        .bank.mid {
            --h: clamp(84px, 19vh, 220px);
            --dur: 115s;
            background-image: url("assets/images/bg/cloud-day-mid.svg");
        }

        .bank.front {
            --h: clamp(58px, 12vh, 150px);
            --dur: 85s;
            background-image: url("assets/images/bg/cloud-day-front.svg");
        }

        html[data-theme="night"] .bank.back {
            background-image: url("assets/images/bg/cloud-night-back.svg");
        }

        html[data-theme="night"] .bank.mid {
            background-image: url("assets/images/bg/cloud-night-mid.svg");
        }

        html[data-theme="night"] .bank.front {
            background-image: url("assets/images/bg/cloud-night-front.svg");
        }

        /* ---------- Kartu ---------- */
        .card {
            width: 100%;
            max-width: 520px;
            padding: clamp(22px, 4.5vh, 40px) clamp(18px, 5vw, 40px) clamp(22px, 4vh, 34px);
            text-align: center;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            animation: card-in .55s cubic-bezier(.34, 1.4, .64, 1) both;
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.96);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ikon POPBA (assets/images/icon.png) */
        .icon-wrap {
            width: clamp(104px, 26vh, 184px);
            aspect-ratio: 1 / 1;
            margin: 0 auto clamp(10px, 2vh, 18px);
            border-radius: 26%;
            border: 4px solid var(--icon-ring);
            background: #86cdff;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(30, 60, 120, .32);
            animation: float 3.4s ease-in-out infinite;
        }

        .icon-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            -webkit-user-drag: none;
            user-select: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-12px) rotate(3deg);
            }
        }

        /* ---------- Teks ---------- */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            margin-bottom: 10px;
            border-radius: 999px;
            font-size: .9rem;
            font-weight: 800;
            letter-spacing: .02em;
            color: var(--chip-text);
            background: var(--chip-bg);
        }

        .chip .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--dot);
        }

        body[data-state="offline"] .chip .dot {
            background: #e5484d;
            animation: pulse 1.8s ease-in-out infinite;
        }

        body[data-state="back"] .chip .dot {
            background: #2fb86b;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        h1 {
            font-family: 'Whale I Tried', 'Nunito', system-ui, sans-serif;
            font-weight: 400;
            font-size: clamp(1.9rem, 7vw, 2.7rem);
            line-height: 1.12;
            color: var(--title);
            margin-bottom: 10px;
            text-wrap: balance;
        }

        html[data-theme="night"] h1 {
            text-shadow: 2px 2px 0 #4a4a7a, 0 0 18px rgba(255, 224, 102, .3);
        }

        .message {
            font-size: clamp(1rem, 3.6vw, 1.12rem);
            font-weight: 600;
            line-height: 1.55;
            margin: 0 auto 18px;
            max-width: 40ch;
            text-wrap: balance;
        }

        /* ---------- Tombol ---------- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 52px;
            min-width: 150px;
            padding: 12px 26px;
            border: 2px solid transparent;
            border-radius: 16px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.1;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .2s cubic-bezier(.34, 1.56, .64, 1), box-shadow .2s ease, background .2s ease;
        }

        .btn svg {
            width: 22px;
            height: 22px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(145deg, var(--btn-from), var(--btn-to));
            box-shadow: 0 6px 16px var(--btn-shadow);
        }

        .btn-ghost {
            color: var(--ghost-text);
            background: transparent;
            border-color: var(--ghost-border);
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .btn-ghost:hover {
            background: var(--ghost-hover);
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 3px;
        }

        .btn[disabled] {
            opacity: .75;
            cursor: progress;
            transform: none;
        }

        .btn.loading svg {
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn.shake {
            animation: shake .4s ease;
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        /* tombol "Coba Lagi" hanya untuk keadaan offline */
        #retry {
            display: none;
        }

        body[data-state="offline"] #retry {
            display: inline-flex;
        }

        .hint {
            min-height: 1.4em;
            margin-top: 14px;
            font-size: .95rem;
            font-weight: 700;
            opacity: .9;
        }

        /* kosong = tidak memakan tempat */
        .hint:empty {
            display: none;
        }

        /* ---------- HP dengan layar pendek (landscape) ---------- */
        @media (max-height: 460px) {
            body {
                padding: 10px 12px;
            }

            .card {
                display: grid;
                grid-template-columns: auto 1fr;
                column-gap: 22px;
                align-items: center;
                max-width: 720px;
                text-align: left;
            }

            .icon-wrap {
                grid-row: 1 / span 5;
                width: clamp(96px, 38vh, 150px);
                margin: 0;
            }

            .chip {
                justify-self: start;
            }

            .message {
                margin-left: 0;
                margin-bottom: 12px;
            }

            .actions {
                justify-content: flex-start;
            }

            .btn {
                min-height: 46px;
                font-size: 1.05rem;
            }

            .hint {
                margin-top: 8px;
            }
        }

        @media (max-width: 380px) {
            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .bank,
            .icon-wrap,
            .card,
            .chip .dot,
            .btn.loading svg {
                animation: none !important;
            }

            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body data-state="notfound">
    <div class="sky" aria-hidden="true">
        <div class="bank back"></div>
        <div class="bank mid"></div>
        <div class="bank front"></div>
    </div>

    <main class="card">
        <div class="icon-wrap">
            <!-- src diisi lewat skrip (bukan atribut) supaya browser tidak mengambil gambar dari path yang salah
                 sebelum alamat dasar (base) di atas berlaku -->
            <img id="icon" width="1024" height="1024" alt="Ikon PopBA - Pop Balon Ajaib" decoding="async">
            <script>document.getElementById('icon').src = 'assets/images/icon.png';</script>
        </div>

        <div class="chip"><span class="dot"></span><span id="chip-text">Error 404</span></div>

        <h1 id="title">Yah, halamannya tidak ketemu!</h1>
        <p class="message" id="message">
            Balonnya terbang terlalu jauh, jadi halaman yang kamu cari tidak ada di sini.
            Yuk, kembali ke menu dan lanjut bermain!
        </p>

        <div class="actions">
            <button type="button" id="retry" class="btn btn-primary">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <path d="M21 4v5h-5" />
                </svg>
                <span id="retry-text">Coba Lagi</span>
            </button>
            <a id="home" class="btn btn-primary" href="index.html">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 11.5 12 4l9 7.5" />
                    <path d="M5.5 10v9.5h13V10" />
                    <path d="M10 19.5v-5h4v5" />
                </svg>
                Menu Utama
            </a>
        </div>

        <p class="hint" id="hint" role="status" aria-live="polite"></p>
    </main>

    <script>
        (function () {
            'use strict';

            var body = document.body;
            var chipText = document.getElementById('chip-text');
            var title = document.getElementById('title');
            var message = document.getElementById('message');
            var retry = document.getElementById('retry');
            var retryText = document.getElementById('retry-text');
            var home = document.getElementById('home');
            var hint = document.getElementById('hint');

            var STATES = {
                notfound: {
                    tab: 'Pop Balon Ajaib - Halaman Tidak Ditemukan',
                    chip: 'Error 404',
                    title: 'Yah, halamannya tidak ketemu!',
                    message: 'Balonnya terbang terlalu jauh, jadi halaman yang kamu cari tidak ada di sini. Yuk, kembali ke menu dan lanjut bermain!'
                },
                offline: {
                    tab: 'Pop Balon Ajaib - Tidak Ada Internet',
                    chip: 'Tidak ada internet',
                    title: 'Yah, internetnya putus!',
                    message: 'POPBA butuh internet supaya bisa dimainkan. Nyalakan Wi-Fi atau data seluler, lalu tekan Coba Lagi.'
                },
                back: {
                    tab: 'Pop Balon Ajaib - Terhubung',
                    chip: 'Terhubung',
                    title: 'Yeay, internetnya sudah nyala!',
                    message: 'Sebentar ya, POPBA sedang dibuka...'
                }
            };

            function setState(name) {
                var s = STATES[name];
                body.setAttribute('data-state', name);
                document.title = s.tab;
                chipText.textContent = s.chip;
                title.textContent = s.title;
                message.textContent = s.message;
                // "Coba Lagi" jadi tombol utama saat offline; "Menu Utama" jadi tombol biasa
                home.className = 'btn ' + (name === 'offline' ? 'btn-ghost' : 'btn-primary');
                hint.textContent = '';
            }

            function openGame() {
                setTimeout(function () { window.location.href = home.href; }, 700);
            }

            // Cek koneksi sungguhan (bukan hanya navigator.onLine): minta file kecil dari server sendiri.
            function cekKoneksi(callback) {
                if (!window.fetch) { callback(navigator.onLine); return; }
                var selesai = false;
                function akhir(ok) {
                    if (selesai) { return; }
                    selesai = true;
                    clearTimeout(timer);
                    callback(ok);
                }
                var timer = setTimeout(function () { akhir(false); }, 6000);
                // "cek-koneksi" dikenali sw.js: langsung ke jaringan, tidak dijawab dari cache
                fetch('assets/images/balloon-favicon.ico?cek-koneksi=' + Date.now(), { cache: 'no-store' })
                    .then(function (r) { akhir(r.ok); })
                    .catch(function () { akhir(false); });
            }

            function tersambung() {
                setState('back');
                openGame();
            }

            retry.addEventListener('click', function () {
                retry.disabled = true;
                retry.classList.add('loading');
                retryText.textContent = 'Memeriksa...';
                hint.textContent = '';
                cekKoneksi(function (ok) {
                    retry.disabled = false;
                    retry.classList.remove('loading');
                    retryText.textContent = 'Coba Lagi';
                    if (ok) {
                        tersambung();
                    } else {
                        hint.textContent = 'Masih belum terhubung. Coba lagi sebentar lagi, ya.';
                        retry.classList.remove('shake');
                        void retry.offsetWidth;
                        retry.classList.add('shake');
                    }
                });
            });

            window.addEventListener('online', function () {
                if (body.getAttribute('data-state') !== 'offline') { return; }
                cekKoneksi(function (ok) { if (ok) { tersambung(); } });
            });

            window.addEventListener('offline', function () {
                if (body.getAttribute('data-state') === 'back') { return; }
                setState('offline');
            });

            // Keadaan awal: tanpa internet -> "offline", selain itu -> "halaman tidak ditemukan"
            if (!navigator.onLine) { setState('offline'); }
        })();
    </script>
</body>

</html>
